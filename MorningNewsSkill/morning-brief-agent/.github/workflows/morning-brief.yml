name: Daily Morning Brief

on:
  schedule:
    - cron: "0 6 * * *"  # 08:00 CET = 06:00 UTC
  workflow_dispatch:

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node (if needed)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude CLI
        run: |
          npm install -g @anthropic-ai/claude-cli

      - name: Run Morning Brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          chmod +x scripts/run_morning_brief.sh
          ./scripts/run_morning_brief.sh

      - name: Commit & Push Output
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "bot@users.noreply.github.com"

          git add output/*.md || true

          git commit -m "Morning Brief $(date +'%Y-%m-%d')" || echo "No changes"

          git push
